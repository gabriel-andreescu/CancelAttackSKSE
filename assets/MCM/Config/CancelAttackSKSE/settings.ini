[General]
; Enable diagnostic logging.
bDebugLogging=0
; 0 = Block, 1 = Ready Weapon, 2 = Custom key.
iBinding=0
; SkyUI keymap code. -1 leaves the custom key unbound.
iCustomKey=-1
; 0 = Disabled, 1 = Block, 2 = Ready Weapon, 3 = Custom key.
iAdditionalBinding=0
; SkyUI keymap code. -1 leaves the additional custom key unbound.
iAdditionalCustomKey=-1
; 0 = Cancel and block, 1 = Cancel only.
iBehavior=0

[Timing]
; Seconds after the attack starts. Zero for the end disables the upper bound.
fWindowStart=0.0
fWindowEnd=0.0

[Stamina]
fOneHandedCost=0.0
fTwoHandedCost=0.0
fUnarmedCost=0.0

[Weapons]
bDaggers=1
bSwords=1
bWarAxes=1
bMaces=1
bGreatswords=1
bBattleaxesAndWarhammers=1
bDualWield=1
bUnarmed=1
